name: Repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runner prerequisites
        run: python3 scripts/verify-environment.py --require node
      - name: Run offline quality gates
        run: python3 scripts/run-quality-gates.py
      - name: Verify archived upstream sources
        run: python3 scripts/vendor-skills.py verify
